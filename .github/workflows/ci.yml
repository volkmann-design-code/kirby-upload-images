name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, Kirby ${{ matrix.kirby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        # the newest 5.x and the oldest one Composer installs (older ones
        # are blocked by security advisories)
        kirby: [latest, lowest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # the Imagick tests skip without it
          extensions: imagick, exif, gd
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-version
      - name: Install dependencies
        run: composer update --no-progress --prefer-dist ${{ matrix.kirby == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Versions
        run: |
          composer show getkirby/cms | grep versions
          php -r 'echo Imagick::getVersion()["versionString"], " · HEIC: ", implode(",", Imagick::queryFormats("HEI*")) ?: "none", PHP_EOL;'
      - name: Run tests
        run: composer test
