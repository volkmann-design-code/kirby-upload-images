name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, Kirby ${{ matrix.kirby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        # the oldest 5.x Composer installs (older ones are blocked by
        # security advisories), the newest, and Kirby 6 (needs PHP 8.3)
        kirby: ["5.5.2", "5.6.1", "6.0.0-alpha.3"]
        exclude:
          - php: "8.2"
            kirby: "6.0.0-alpha.3"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # the Imagick tests skip without it
          extensions: imagick, exif, gd
          coverage: none
      - name: Validate composer.json
        run: composer validate --no-check-version
      - name: Install dependencies
        run: composer require --dev --no-progress --no-interaction --prefer-dist -W "getkirby/cms:${{ matrix.kirby }}"
      - name: Versions
        run: |
          composer show getkirby/cms | grep versions
          php -r 'echo Imagick::getVersion()["versionString"], " · HEIC: ", implode(",", Imagick::queryFormats("HEI*")) ?: "none", PHP_EOL;'
      - name: Run tests
        run: composer test
